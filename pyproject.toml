[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qnagym"
version = "0.1.0"
description = "Knowledge acquisition practice CLI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Hubert Sekowski", email = "hlsekowski@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["openai>=1.40"]
urls = {Repository = "https://github.com/hlsekowski/qnagym", Issues = "https://github.com/hlsekowski/qnagym/issues"}

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8.0", "freezegun>=1.5"]

[project.scripts]
qnagym = "qnagym.adapters.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["T201"]
